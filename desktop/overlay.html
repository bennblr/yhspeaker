<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'unsafe-inline'; script-src 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LA2Speak — канал</title>
    <style>
      :root {
        color-scheme: dark;
        --ok: #3ddc97;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: transparent;
      }

      body {
        font-family: "Segoe UI", system-ui, sans-serif;
        color: #e7eaf3;
        -webkit-user-select: none;
        user-select: none;
        padding: 4px;
      }

      .card {
        display: flex;
        flex-direction: column;
        height: 100%;
        padding: 4px 6px;
      }

      .card[hidden] {
        display: none;
      }

      .rows {
        display: flex;
        flex-direction: column;
        gap: 2px;
        min-height: 0;
        overflow: hidden;
      }

      .row {
        display: flex;
        align-items: center;
        gap: 7px;
        height: 22px;
        padding: 0 4px;
        flex: 0 0 auto;
      }

      .activity {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        flex-shrink: 0;
        visibility: hidden;
      }

      .row.speaking .activity {
        visibility: visible;
        background: var(--ok);
        box-shadow:
          0 0 6px rgba(61, 220, 151, 0.9),
          0 1px 2px rgba(0, 0, 0, 0.7);
      }

      .name {
        flex: 1;
        min-width: 0;
        font-size: 11px;
        font-weight: 500;
        color: #dfe5f2;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.95);
      }

      .row.speaking .name {
        color: #ffffff;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div id="card" class="card" hidden>
      <div id="rows" class="rows"></div>
    </div>
    <script src="overlay.js"></script>
  </body>
</html>
