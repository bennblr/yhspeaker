<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'unsafe-inline'; script-src 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LA2Speak — канал</title>
    <style>
      :root {
        color-scheme: dark;
        --panel: rgba(10, 12, 18, 0.7);
        --line: rgba(255, 255, 255, 0.07);
        --text: #e7eaf3;
        --muted: #8a93a8;
        --ok: #3ddc97;
        --accent: #6c7cff;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: transparent;
      }

      body {
        font-family: "Segoe UI", system-ui, sans-serif;
        color: var(--text);
        -webkit-user-select: none;
        user-select: none;
        padding: 4px;
      }

      .card {
        display: flex;
        flex-direction: column;
        height: 100%;
        padding: 6px 7px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--panel);
        box-shadow: 0 8px 22px rgba(0, 0, 0, 0.45);
        backdrop-filter: blur(10px);
      }

      .card[hidden] {
        display: none;
      }

      .head {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 0 2px 5px;
        border-bottom: 1px solid var(--line);
        flex: 0 0 auto;
      }

      .head .dot {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: var(--ok);
        box-shadow: 0 0 6px rgba(61, 220, 151, 0.8);
        flex-shrink: 0;
      }

      .head .channel {
        flex: 1;
        min-width: 0;
        font-size: 9.5px;
        font-weight: 700;
        letter-spacing: 0.09em;
        text-transform: uppercase;
        color: #c4cbdc;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .head .count {
        font-size: 9px;
        font-weight: 600;
        color: var(--muted);
        flex-shrink: 0;
      }

      .rows {
        display: flex;
        flex-direction: column;
        gap: 2px;
        padding-top: 4px;
        min-height: 0;
        overflow: hidden;
      }

      .row {
        display: flex;
        align-items: center;
        gap: 6px;
        height: 22px;
        padding: 0 4px;
        border-radius: 6px;
        flex: 0 0 auto;
      }

      .row.speaking {
        background: rgba(61, 220, 151, 0.08);
      }

      .avatar {
        width: 16px;
        height: 16px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 8px;
        font-weight: 700;
        color: #fff;
        flex-shrink: 0;
      }

      .row.speaking .avatar {
        box-shadow: 0 0 0 2px var(--ok);
      }

      .name {
        flex: 1;
        min-width: 0;
        font-size: 11px;
        font-weight: 500;
        color: #ccd3e2;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .row.speaking .name {
        color: #ffffff;
        font-weight: 600;
      }

      .row.off .name {
        color: #79839a;
      }

      .me {
        font-size: 8px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--accent);
        flex-shrink: 0;
      }

      .badges {
        display: flex;
        align-items: center;
        gap: 3px;
        flex-shrink: 0;
        color: #7c869c;
      }

      .badges svg {
        width: 10px;
        height: 10px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .badges .live {
        color: var(--ok);
      }

      .more {
        height: 20px;
        display: flex;
        align-items: center;
        padding-left: 26px;
        font-size: 9.5px;
        color: var(--muted);
        flex: 0 0 auto;
      }
    </style>
  </head>
  <body>
    <div id="card" class="card" hidden>
      <div class="head">
        <span class="dot"></span>
        <span id="channel" class="channel">Голосовой канал</span>
        <span id="count" class="count"></span>
      </div>
      <div id="rows" class="rows"></div>
    </div>
    <script src="overlay.js"></script>
  </body>
</html>
